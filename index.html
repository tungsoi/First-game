<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ếch Nhảy Sen</title>
<style>
  html,body{margin:0;height:100%;background:#7fcbe8;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;margin:0 auto;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---- low-res pixel buffer (1 game px = 2 screen px) ----
const W = 200, H = 350, S = 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const bf = document.createElement('canvas'); bf.width = W; bf.height = H;
const b = bf.getContext('2d');
function fit() {
  const dpr = Math.min(devicePixelRatio || 1, 3);
  const h = innerHeight, w = Math.min(innerWidth, h * W / H);
  cv.style.width = w + 'px'; cv.style.height = (w * H / W) + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(w * H / W * dpr);
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', fit); fit();

const G = 900, JV = 380, CUT = 0.42, PX = 55, CAMY0 = -H * 0.55;
let best = 0; try { best = +localStorage.getItem('frog_best') || 0; } catch (e) {}
const R = (a, c) => a + Math.random() * (c - a);
const RI = (a, c) => Math.floor(R(a, c + 1));
const lerp = (a, c, k) => a + (c - a) * Math.min(1, k);
const rnd = Math.round;

// ---- pixel helpers ----
function rect(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(rnd(x), rnd(y), w, h); }
function pixEllipse(c, cx, cy, rx, ry, col) {
  c.fillStyle = col; cx = rnd(cx); cy = rnd(cy);
  for (let y = -ry; y <= ry; y++) {
    const half = rnd(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))));
    c.fillRect(cx - half, cy + y, half * 2 + 1, 1);
  }
}
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, c, k) => `rgb(${rnd(lerp(a[0], c[0], k))},${rnd(lerp(a[1], c[1], k))},${rnd(lerp(a[2], c[2], k))})`;
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >> 13)) * 1274126177 | 0; return ((h ^ (h >> 16)) >>> 0) / 4294967296; };

// ---- game state ----
let plats, tiers, fish, p, camX, camY, refY, lastEnd, curL, leavesLeft, speed, t, clock = 0, score, dead, deadT, jumps, parts, shake;

function reset() {
  plats = [{ ground: true, x: -300, w: 400, y: 0, L: 0 }];
  tiers = [{ x0: 100, L: 0 }];
  p = { x: 0, y: 0, vy: 0, on: true, buf: 0, coy: 0, sqx: 0, sqv: 0, stretch: 0, pl: 0, rot: 0 };
  camX = -PX; camY = CAMY0; refY = 0; lastEnd = 100; curL = 0; leavesLeft = 3;
  speed = 90; t = 0; score = 0; dead = false; deadT = 0; jumps = 0; parts = []; shake = 0;
  fish = [];
  const cols = ['#ff9a3c', '#ffd84a', '#ff6f61', '#f2f2f2'];
  for (let i = 0; i < 9; i++) fish.push({ x: camX + R(0, W + 150), y: 0, dy: R(16, 70), d: Math.random() < .5 ? -1 : 1, v: R(10, 28), s: R(.8, 1.3), c: cols[i % 4], ph: R(0, 6) });
  gen();
}
function gen() {
  while (lastEnd < camX + W + 250) {
    const lvl = Math.min(t / 90, 1);
    let gap = 10 + speed * R(0.1, 0.3);
    if (leavesLeft === 0) {
      let nl;
      if (Math.random() < 0.75) { nl = curL - RI(12, 30); gap = 8 + speed * R(0.08, 0.22); }
      else nl = Math.min(curL + RI(8, 20), 12);
      tiers.push({ x0: lastEnd + gap * 0.5, L: nl });
      curL = nl; leavesLeft = RI(2, 5);
    }
    const w = Math.max(32, 72 - 30 * lvl - R(0, 12));
    const x = lastEnd + gap;
    plats.push({ x, w, y: curL, L: curL, ph: R(0, 6), dip: 0, fl: Math.random() < .35 ? (Math.random() < .5 ? -1 : 1) : 0 });
    lastEnd = x + w; leavesLeft--;
  }
}
function waterAt(x) {
  if (x < tiers[0].x0) return 9999;
  let L = tiers[0].L;
  for (let i = 0; i < tiers.length; i++) {
    if (tiers[i].x0 <= x) L = tiers[i].L;
    if (i > 0 && Math.abs(x - tiers[i].x0) < 4) return Math.min(tiers[i - 1].L, tiers[i].L);
  }
  return L;
}
function puff(x, y, n, c) { for (let i = 0; i < n; i++) parts.push({ x, y, vx: R(-55, 55), vy: -R(30, 130), t: .6, c }); }

// ---- input ----
function press(e) {
  if (e && e.preventDefault) e.preventDefault();
  if (dead) { if (deadT > 0.5) reset(); return; }
  p.buf = 0.12;
}
function release(e) {
  if (e && e.preventDefault) e.preventDefault();
  if (!p.on && p.vy < 0 && p.jumping) p.vy *= CUT;
  p.jumping = false;
}
function doJump() {
  p.vy = -JV; p.on = false; p.jumping = true; p.buf = 0; p.coy = 0; jumps++;
  p.sqx = -0.3; p.sqv = 0;
  puff(p.x, p.y, 4, '#d6f5ff');
}
cv.addEventListener('pointerdown', press);
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('keydown', e => { if (!e.repeat && ['Space', 'ArrowUp', 'KeyW'].includes(e.code)) press(e); });
addEventListener('keyup', e => { if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) release(e); });

// ---- update ----
function stepParts(dt) {
  for (const q of parts) { q.t -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 350 * dt; }
  parts = parts.filter(q => q.t > 0);
}
function stepFish(dt) {
  for (const f of fish) {
    f.x += f.d * f.v * dt;
    const ty = waterAt(f.x) + f.dy;
    f.y = f.y ? lerp(f.y, Math.min(ty, 99999), dt * 2) : Math.min(ty, 99999);
    if (f.x < camX - 60) { f.x = camX + W + R(20, 150); f.y = 0; f.dy = R(16, 70); }
    else if (f.x > camX + W + 200) { f.x = camX - R(20, 80); f.y = 0; f.dy = R(16, 70); }
  }
}
function stepFrogAnim(dt) {
  p.sqv += (-p.sqx * 420 - p.sqv * 20) * dt; p.sqx += p.sqv * dt;
  const ts = p.on ? 0 : -Math.min(Math.abs(p.vy) / 700, 1) * 0.3;
  p.stretch = lerp(p.stretch, ts, dt * 12);
  p.pl = lerp(p.pl, p.on ? 0 : 1, dt * 12);
  p.rot = lerp(p.rot, p.on ? 0 : Math.max(-.35, Math.min(.35, p.vy / 900)), dt * 9);
}
function update(dt) {
  clock += dt;
  stepFish(dt); stepParts(dt);
  if (dead) { deadT += dt; shake = Math.max(0, shake - dt * 20); p.y += 50 * dt; stepFrogAnim(dt); return; }
  t += dt;
  speed = Math.min(180, 90 + t * 2);
  for (const s of plats) {
    if (s.ground) continue;
    const onIt = p.on && p.x > s.x - 2 && p.x < s.x + s.w + 2;
    s.dip = lerp(s.dip, onIt ? 2.5 : 0, dt * 10);
    s.y = s.L + Math.sin(clock * 2.2 + s.ph) * 1.1 + s.dip;
  }
  const py = p.y;
  p.x += speed * dt;
  p.buf = Math.max(0, p.buf - dt); p.coy = Math.max(0, p.coy - dt);
  p.vy = Math.min(p.vy + G * dt, 700);
  p.y += p.vy * dt;
  let landed = null;
  if (p.vy >= 0) {
    for (const s of plats) {
      if (py <= s.y + 2 && p.y >= s.y && p.x > s.x - 2 && p.x < s.x + s.w + 2) { landed = s; break; }
    }
  }
  if (landed) {
    if (!p.on) { p.sqx = 0.34; p.sqv = 0; puff(p.x, landed.y, 4, '#d6f5ff'); }
    p.y = landed.y; p.vy = 0; p.on = true; p.coy = 0.1; p.jumping = false; refY = landed.L;
    score = Math.max(score, Math.floor(-landed.L / 4));
  } else if (p.on) { p.on = false; p.coy = 0.1; }
  if (p.buf > 0 && (p.on || p.coy > 0)) doJump();
  stepFrogAnim(dt);
  if (score > best) { best = score; try { localStorage.setItem('frog_best', best); } catch (e) {} }
  camX = p.x - PX;
  camY += ((refY + CAMY0) - camY) * Math.min(1, dt * 3.5);
  if (!p.on && p.y > waterAt(p.x) + 7) { dead = true; deadT = 0; shake = 4; puff(p.x, waterAt(p.x), 12, '#bfefff'); }
  gen();
  plats = plats.filter(s => s.x + s.w > camX - 100);
  while (tiers.length > 2 && tiers[1].x0 < camX - 120) tiers.shift();
  shake = Math.max(0, shake - dt * 20);
}

// ---- frog sprite: smooth vector pose -> hard-pixel posterize ----
const fc = document.createElement('canvas'); fc.width = fc.height = 48;
const f = fc.getContext('2d', { willReadFrequently: true });
const PAL = ['#1d4d2b', '#5fd35f', '#3a9c44', '#e6ffc8', '#ffffff', '#222222', '#ff8fa8'].map(hex);
function frogSprite() {
  f.clearRect(0, 0, 48, 48);
  const k = p.sqx + p.stretch, pl = p.pl, run = p.on ? Math.sin(p.x / 5) : 0;
  const br = p.on ? Math.sin(clock * 5) * 0.02 : 0, bob = p.on ? Math.abs(run) * 0.8 : 0;
  const eo = (clock % 3.2) < 0.12 ? 0.15 : 1;
  f.save(); f.translate(24, 42 - bob); f.rotate(p.rot); f.scale(1 + k * 0.7, 1 - k + br);
  f.lineWidth = 1.2; f.strokeStyle = '#1d4d2b'; f.lineJoin = 'round';
  const el = (x, y, rx, ry, rot, fill) => { f.fillStyle = fill; f.beginPath(); f.ellipse(x, y, rx, ry, rot || 0, 0, 7); f.fill(); f.stroke(); };
  el(-(6.5 + 4 * pl) - run * 1.8 * (1 - pl), -3 - 3 * pl, 6 + 2.5 * pl, 3.5 - .25 * pl, .5 * pl, '#3a9c44');
  el(0, -10, 11, 9, 0, '#5fd35f');
  f.fillStyle = '#e6ffc8'; f.beginPath(); f.ellipse(2, -6.5, 6.5, 4.5, 0, 0, 7); f.fill();
  f.fillStyle = '#3a9c44'; for (const [x, y] of [[-5, -14], [-1, -12], [-7, -9]]) { f.beginPath(); f.arc(x, y, 1.3, 0, 7); f.fill(); }
  for (const x of [-3.5, 4.5]) {
    el(x, -17.5, 4.5, 4.5, 0, '#5fd35f');
    f.fillStyle = '#fff'; f.beginPath(); f.ellipse(x, -18, 3, 3 * eo, 0, 0, 7); f.fill();
    f.fillStyle = '#222'; f.beginPath(); f.ellipse(x + 1, -17.5, 1.7, 1.7 * eo, 0, 0, 7); f.fill();
  }
  f.fillStyle = '#ff8fa8'; f.beginPath(); f.arc(7.5, -8.5, 1.8, 0, 7); f.fill();
  f.strokeStyle = '#1d4d2b'; f.lineWidth = 1; f.beginPath(); f.moveTo(1, -9.5); f.quadraticCurveTo(5, -5.5 + 2 * pl, 9.5, -11); f.stroke();
  f.lineWidth = 1.2; el(6 + 1.5 * pl + run * 1.2 * (1 - pl), -1 - 1.5 * pl, 4, 2, 0, '#3a9c44');
  f.restore();
  const img = f.getImageData(0, 0, 48, 48), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] < 120) { d[i + 3] = 0; continue; }
    let bi = 0, bd = 1e9;
    for (let j = 0; j < PAL.length; j++) {
      const dr = d[i] - PAL[j][0], dg = d[i + 1] - PAL[j][1], db = d[i + 2] - PAL[j][2], dd = dr * dr + dg * dg + db * db;
      if (dd < bd) { bd = dd; bi = j; }
    }
    d[i] = PAL[bi][0]; d[i + 1] = PAL[bi][1]; d[i + 2] = PAL[bi][2]; d[i + 3] = 255;
  }
  f.putImageData(img, 0, 0);
  return fc;
}

// ---- leaf sprites (cached) ----
const leafCache = {};
function leafSprite(w, fl) {
  w = rnd(w); const key = w + '_' + fl;
  if (leafCache[key]) return leafCache[key];
  const c = document.createElement('canvas'); c.width = w + 6; c.height = 18;
  const g = c.getContext('2d'); const cx = (w + 6) >> 1, cy = 13, rx = w >> 1, ry = 5;
  pixEllipse(g, cx, cy + 1, rx + 1, ry + 1, 'rgba(20,70,60,.5)'); // soft shadow on water
  pixEllipse(g, cx, cy, rx, ry, '#1c6b32');
  pixEllipse(g, cx, cy, rx - 1, ry - 1, '#3fbf5a');
  pixEllipse(g, cx, cy - 1, rx - 4, Math.max(1, ry - 3), '#6fdc7e');
  g.fillStyle = '#2c9a48';
  for (let i = 1; i < 6; i++) { const a = .3 + i * 0.95; for (let r = 3; r < rx - 2; r += 1) g.fillRect(cx + rnd(Math.cos(a) * r), cy + rnd(Math.sin(a) * r * ry / rx), 1, 1); }
  for (let dx = 0; dx <= rx + 1; dx++) { const h = rnd(dx * 0.22); g.clearRect(cx + dx, cy - h, 1, h * 2 + 1); }
  if (fl) {
    const fx = cx + rnd(fl * w * 0.28), fy = cy - 1;
    pixEllipse(g, fx - 3, fy - 3, 1, 3, '#ff9fc4'); pixEllipse(g, fx + 3, fy - 3, 1, 3, '#ff9fc4');
    pixEllipse(g, fx - 1, fy - 4, 1, 4, '#ffb8d4'); pixEllipse(g, fx + 1, fy - 4, 1, 4, '#ffb8d4'); pixEllipse(g, fx, fy - 5, 1, 5, '#ffd0e4');
    g.fillStyle = '#ffd84a'; g.fillRect(fx - 1, fy - 1, 3, 2);
  }
  return leafCache[key] = c;
}

// ---- draw ----
const SKY0 = hex('#8fd3f4'), SKY1 = hex('#dff6ff'), DSK0 = hex('#5b6fb8'), DSK1 = hex('#f6c28b');
const WT = hex('#62cfe0'), WD = hex('#0b5272');
function drawFish(fh) {
  if (fh.y > 9000) return;
  const s = fh.s, d = fh.d, x = fh.x, y = fh.y + Math.sin(clock + fh.ph) * 1.5, wag = Math.sin(clock * 7 + fh.ph);
  b.globalAlpha = 0.85;
  for (let i = 0; i < 4; i++) rect(b, x - d * (6 * s + i + 1), y - i * .8 * s + wag * i * .5, 1, rnd(1 + i * 1.6 * s), fh.c);
  pixEllipse(b, x, y, rnd(6 * s), rnd(3 * s), fh.c);
  rect(b, x - 3 * s, y + 1, rnd(6 * s), 1, 'rgba(255,255,255,.45)');
  rect(b, x + d * 3 * s, y - 1, 1, 1, '#222');
  b.globalAlpha = 1;
}
function draw() {
  const alt = Math.max(0, CAMY0 - camY), k = Math.min(alt / 400, 1) * 0.55;
  const bands = 16;
  for (let i = 0; i < bands; i++) {
    const kk = i / (bands - 1), top = mix(SKY0, SKY1, kk), c2 = mix(DSK0, DSK1, kk);
    rect(b, 0, i * H / bands, W, H / bands + 1, mix(hex2(top), hex2(c2), k));
  }
  b.save();
  if (shake > 0) b.translate(rnd(R(-.5, .5) * shake), rnd(R(-.5, .5) * shake));
  // clouds
  b.fillStyle = 'rgba(255,255,255,.7)';
  for (let i = 0; i < 5; i++) {
    const cx = (((i * 83 - camX * 0.12) % (W + 80)) + W + 80) % (W + 80) - 40, cy = 24 + i * 22 - alt * 0.05;
    pixEllipse(b, cx, cy, 20, 5, 'rgba(255,255,255,.75)'); pixEllipse(b, cx + 12, cy - 4, 12, 4, 'rgba(255,255,255,.75)');
  }
  // hills
  const hb = 185 + (camY - CAMY0) * -0.3;
  for (let i = -1; i < 5; i++) {
    const hx = i * 130 + 50 - ((camX * 0.25) % 130 + 130) % 130 + 130;
    pixEllipse(b, hx, hb, 85 + (i & 1) * 20, 30 + ((i * 37) & 15), i % 2 ? '#8fd48a' : '#74c46f');
  }
  rect(b, 0, hb, W, H, '#74c46f');
  const cx = rnd(camX), cy = rnd(camY);
  b.translate(-cx, -cy);
  // water tiers
  for (let i = 0; i < tiers.length; i++) {
    const x0 = Math.max(tiers[i].x0, cx - 1), x1 = i + 1 < tiers.length ? Math.min(tiers[i + 1].x0, cx + W + 1) : cx + W + 1;
    if (x1 <= x0) continue;
    const L = rnd(tiers[i].L);
    for (let j = 0; j < 9; j++) rect(b, x0, L + 2 + j * 8, x1 - x0, j === 8 ? H * 3 : 8, mix(WT, WD, Math.min(1, j / 6)));
    for (let x = rnd(x0); x < x1; x += 3) { const o = Math.round(Math.sin(x * 0.12 + clock * 2.4)); rect(b, x, L + 1 + o, 2, 1, 'rgba(255,255,255,.7)'); }
  }
  for (const fh of fish) drawFish(fh);
  // bank
  if (cx < 100) {
    rect(b, -300, 0, 400, 600, '#8a5a2b');
    for (let y = 4; y < 80; y += 3) for (let x = rnd(cx) - 2; x < 100; x += 3) if (hash(x, y) < .12) rect(b, x, y, 2, 1, '#6b4423');
    rect(b, -300, 0, 400, 4, '#58d655'); rect(b, -300, 4, 400, 1, '#1f7a2a');
    for (let x = rnd(cx); x < 100; x += 2) if (hash(x, 1) < .5) rect(b, x, -1, 1, 1, '#58d655');
    // tree
    rect(b, -29, -34, 5, 34, '#6b4423'); pixEllipse(b, -26, -42, 16, 13, '#1b5e2a'); pixEllipse(b, -26, -43, 14, 11, '#2f9e44'); pixEllipse(b, -30, -46, 6, 4, '#4cc464');
    // flag
    rect(b, 72, -26, 2, 26, '#6b4423'); rect(b, 74, -26, 11, 7, '#e8453c'); rect(b, 74, -19, 8, 2, '#e8453c');
  }
  // stone walls + waterfalls
  for (let i = 1; i < tiers.length; i++) {
    const bx = rnd(tiers[i].x0), LA = rnd(tiers[i - 1].L), LB = rnd(tiers[i].L), top = Math.min(LA, LB), bot = Math.max(LA, LB);
    if (bx < cx - 12 || bx > cx + W + 12) continue;
    for (let y = top; y < top + 600; y += 4) for (let x = bx - 4; x < bx + 4; x += 4) {
      const h = hash(x + 99, y), col = h < .33 ? '#7d8590' : h < .66 ? '#6a727c' : '#8d95a0';
      rect(b, x, y, 4, 4, col);
      if (y === top) rect(b, x, y, 4, 1, '#aab2bc');
    }
    rect(b, bx - 4, top, 1, 600, '#4f565f'); rect(b, bx + 3, top, 1, 600, '#4f565f');
    const wx = LB < LA ? bx - 4 : bx + 0, ph = Math.floor(clock * 40);
    for (let y = top; y < bot + 1; y++) for (let x = 0; x < 4; x++) {
      const v = (y + ph + x * 3) % 9;
      rect(b, wx + x, y, 1, 1, v < 3 ? '#ffffff' : v < 6 ? '#bfefff' : '#7fd3ea');
    }
    if (Math.floor(clock * 6) % 2) rect(b, wx - 1, bot - 1, 6, 2, 'rgba(255,255,255,.8)');
  }
  // leaves
  for (const s of plats) {
    if (s.ground || s.x + s.w < cx - 10 || s.x > cx + W + 10) continue;
    const sp = leafSprite(s.w, s.fl), lx = rnd(s.x + s.w / 2) - (sp.width >> 1), ly = rnd(s.y) - 12;
    const rp = (clock * 0.5 + s.ph) % 1;
    b.globalAlpha = 1 - rp; rect(b, s.x - 2 - rp * 5, s.L + 3, 3, 1, '#fff'); rect(b, s.x + s.w - 1 + rp * 5, s.L + 3, 3, 1, '#fff'); b.globalAlpha = 1;
    b.drawImage(sp, lx, ly);
  }
  for (const q of parts) { b.globalAlpha = Math.min(1, q.t * 2); rect(b, q.x, q.y, 1.5, 1.5, q.c); }
  b.globalAlpha = 1;
  if (dead) b.globalAlpha = Math.max(0.25, 1 - (p.y - waterAt(p.x) - 6) / 60);
  b.drawImage(frogSprite(), rnd(p.x) - 24, rnd(p.y) - 42);
  b.globalAlpha = 1;
  b.restore();
  // upscale
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(bf, 0, 0, cv.width, cv.height);
  // HUD
  const u = cv.width / (W * S);
  ctx.save(); ctx.scale(u, u);
  const T = (s, x, y) => { ctx.strokeText(s, x, y); ctx.fillText(s, x, y); };
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.strokeStyle = '#1b3a4b'; ctx.lineWidth = 6; ctx.lineJoin = 'round';
  ctx.font = 'bold 40px "Courier New",monospace'; T(score + ' m', 200, 56);
  ctx.font = 'bold 14px "Courier New",monospace'; ctx.textAlign = 'left'; ctx.lineWidth = 4; T('BEST ' + best + ' m', 12, 22);
  ctx.textAlign = 'center';
  if (!dead && jumps < 4) {
    ctx.font = 'bold 16px "Courier New",monospace';
    T('Chạm để nhảy – giữ lâu nhảy cao hơn', 200, 630); T('Leo lên các tầng ao sen!', 200, 654);
  }
  if (dead) {
    ctx.fillStyle = 'rgba(10,30,50,.45)'; ctx.fillRect(0, 0, 400, 700);
    ctx.fillStyle = '#fff'; ctx.lineWidth = 6;
    ctx.font = 'bold 32px "Courier New",monospace'; T('TÕM! 💦', 200, 270);
    ctx.font = 'bold 34px "Courier New",monospace'; T(score + ' m', 200, 330);
    ctx.font = 'bold 18px "Courier New",monospace'; T((score >= best && score > 0 ? '🏆 KỶ LỤC MỚI! ' : '') + 'BEST ' + best + ' m', 200, 366);
    if (deadT > 0.5) { ctx.font = 'bold 22px "Courier New",monospace'; T('Chạm để chơi lại', 200, 430); }
  }
  ctx.restore();
}
function hex2(c) { const m = c.match(/\d+/g).map(Number); return m; }

reset();
let lt = performance.now();
function loop(n) {
  const dt = Math.min((n - lt) / 1000, 1 / 30); lt = n;
  update(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
