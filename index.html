<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chỉ Lên</title>
<style>
  html,body{margin:0;height:100%;background:#bfe6ff;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif}
  canvas{display:block;margin:0 auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W = 400, H = 700;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function fit() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const h = innerHeight, w = Math.min(innerWidth, h * W / H);
  cv.style.width = w + 'px'; cv.style.height = (w * H / W) + 'px';
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', fit); fit();

const G = 1800, JV = 760, CUT = 0.42, PX = 110;
let best = 0; try { best = +localStorage.getItem('onlyup_best') || 0; } catch (e) {}
const R = (a, b) => a + Math.random() * (b - a);

let plats, p, camX, camY, refY, topX, lastY, speed, t, score, dead, deadT, jumps, parts, shake, msg, msgT;

function reset() {
  plats = [{ x: -300, y: 0, w: 900, h: 30, ground: true }];
  p = { x: 0, y: 0, vy: 0, on: true, sq: 0, coy: 0, buf: 0, run: 0, face: 1 };
  camX = -PX; camY = -H * 0.62; refY = 0; topX = 600; lastY = 0;
  speed = 180; t = 0; score = 0; dead = false; deadT = 0; jumps = 0; parts = []; shake = 0; msg = ''; msgT = 0;
  gen();
}
function gen() {
  while (topX < camX + W + 500) {
    const lvl = Math.min(-lastY / 4000, 1);
    const gap = 25 + speed * R(0.2, 0.46);
    const w = 150 - 75 * lvl - R(0, 25);
    let y = lastY - R(-40, 90);
    y = Math.min(y, -30);
    topX += gap;
    plats.push({ x: topX, y, w, h: 22, cp: false });
    topX += w; lastY = y;
  }
}
function say(s) { msg = s; msgT = 1.2; }
function puff(x, y, n, c) { for (let i = 0; i < n; i++) parts.push({ x, y, vx: R(-100, 100) - speed * .3, vy: -R(0, 160), t: .5, c }); }

function press(e) {
  if (e && e.preventDefault) e.preventDefault();
  if (dead) { if (deadT > 0.45) reset(); return; }
  p.buf = 0.12; p.held = true;
}
function release(e) {
  if (e && e.preventDefault) e.preventDefault();
  p.held = false;
  if (!p.on && p.vy < 0 && p.jumping) { p.vy *= CUT; }
  p.jumping = false;
}
function doJump() {
  p.vy = -JV; p.on = false; p.jumping = true; p.buf = 0; p.coy = 0; jumps++;
  puff(p.x, p.y, 6, '#fff');
}
cv.addEventListener('pointerdown', press);
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('keydown', e => { if (!e.repeat && ['Space', 'ArrowUp', 'KeyW'].includes(e.code)) press(e); });
addEventListener('keyup', e => { if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) release(e); });

function update(dt) {
  if (dead) { deadT += dt; shake = Math.max(0, shake - dt * 20); stepParts(dt); return; }
  t += dt;
  speed = Math.min(360, 180 + t * 4);
  const py = p.y;
  p.x += speed * dt;
  p.buf = Math.max(0, p.buf - dt);
  p.coy = Math.max(0, p.coy - dt);
  p.vy = Math.min(p.vy + G * dt, 1400);
  p.y += p.vy * dt;
  let landed = null;
  if (p.vy >= 0) {
    for (const s of plats) {
      if (py <= s.y + 2 && p.y >= s.y && p.x > s.x - 4 && p.x < s.x + s.w + 4) { landed = s; break; }
    }
  }
  if (landed) {
    if (!p.on) { p.sq = 1; puff(p.x, landed.y, 6, '#ffe28a'); }
    p.y = landed.y; p.vy = 0; p.on = true; p.coy = 0.1; p.jumping = false; refY = landed.y;
    const m = Math.floor(-landed.y / 8);
    if (m > score) score = m;
  } else if (p.on) {
    p.on = false; p.coy = 0.1;
  }
  if (p.buf > 0 && (p.on || p.coy > 0)) doJump();
  p.sq = Math.max(0, p.sq - dt * 5);
  p.run += dt * speed / 22;
  if (score > best) { best = score; try { localStorage.setItem('onlyup_best', best); } catch (e) {} }
  camX = p.x - PX;
  camY += ((refY - H * 0.62) - camY) * Math.min(1, dt * 4);
  if (p.y > camY + H + 50) { dead = true; deadT = 0; shake = 10; say(''); }
  gen();
  plats = plats.filter(s => s.x + s.w > camX - 200);
  stepParts(dt);
  msgT -= dt; shake = Math.max(0, shake - dt * 20);
}
function stepParts(dt) {
  for (const q of parts) { q.t -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 600 * dt; }
  parts = parts.filter(q => q.t > 0);
}

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function txt(s, x, y) { ctx.strokeText(s, x, y); ctx.fillText(s, x, y); }

function draw() {
  const alt = Math.max(0, -(camY + H * 0.62));
  const k = Math.min(alt / 8000, 1);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `hsl(${200 + k * 60},${70 - k * 20}%,${80 - k * 55}%)`);
  g.addColorStop(1, `hsl(${190 + k * 70},60%,${92 - k * 60}%)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // clouds (parallax)
  ctx.fillStyle = `rgba(255,255,255,${.6 * Math.min(1, alt / 300)})`;
  for (let i = 0; i < 7; i++) {
    const cx = (((i * 157 - camX * 0.25) % (W + 160)) + W + 160) % (W + 160) - 80;
    const cy = (((i * 211 - camY * 0.3) % (H + 100)) + H + 100) % (H + 100) - 50;
    ctx.beginPath(); ctx.ellipse(cx, cy, 50, 16, 0, 0, 7); ctx.ellipse(cx + 28, cy - 8, 30, 14, 0, 0, 7); ctx.fill();
  }
  ctx.save();
  if (shake > 0) ctx.translate(R(-.5, .5) * shake, R(-.5, .5) * shake);
  // hills/trees parallax near ground
  ctx.save(); ctx.translate(-camX * 0.4, -camY);
  ctx.fillStyle = '#8fd48a'; ctx.beginPath(); ctx.ellipse(120, 0, 220, 100, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#74c46f'; ctx.beginPath(); ctx.ellipse(420, 0, 180, 60, 0, Math.PI, 0); ctx.fill();
  ctx.restore();
  ctx.translate(-camX, -camY);
  ctx.lineJoin = 'round'; ctx.lineWidth = 3;
  for (const s of plats) {
    if (s.x + s.w < camX - 20 || s.x > camX + W + 20) continue;
    if (s.ground) {
      ctx.fillStyle = '#8a5a2b'; ctx.fillRect(s.x, 0, s.w, 1200);
      ctx.fillStyle = '#4ccf4a'; ctx.fillRect(s.x, 0, s.w, 14);
      ctx.fillStyle = '#1f7a2a'; ctx.fillRect(s.x, 14, s.w, 3);
      ctx.fillStyle = '#6b4423'; ctx.fillRect(247, -40, 6, 40);
      ctx.fillStyle = '#ffe28a'; ctx.strokeStyle = '#6b4423'; rr(216, -66, 68, 30, 6); ctx.stroke();
      ctx.fillStyle = '#6b4423'; ctx.font = 'bold 18px system-ui'; ctx.textAlign = 'center'; ctx.fillText('0 m', 250, -45);
      continue;
    }
    ctx.strokeStyle = '#3e2410'; ctx.fillStyle = '#9a6a38';
    rr(s.x, s.y, s.w, s.h, 8); ctx.stroke();
    ctx.fillStyle = '#58d655'; ctx.strokeStyle = '#1f7a2a';
    rr(s.x, s.y, s.w, 9, 5); ctx.stroke();
  }
  for (const q of parts) { ctx.globalAlpha = q.t * 2; ctx.fillStyle = q.c; ctx.fillRect(q.x, q.y, 4, 4); }
  ctx.globalAlpha = 1;
  // player
  if (!dead) {
    const sq = p.on ? p.sq * 0.25 : 0;
    const bob = p.on ? Math.abs(Math.sin(p.run)) * 4 : 0;
    ctx.save(); ctx.translate(p.x, p.y - bob);
    if (!p.on) ctx.rotate(Math.max(-.3, Math.min(.3, p.vy / 2500)));
    ctx.scale(1 + sq * .6, 1 - sq);
  const f = p.face; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = '#5a2d0c';
  // tail
  ctx.beginPath(); ctx.moveTo(-f * 18, -10); ctx.quadraticCurveTo(-f * 40, -14, -f * 34, -38); ctx.lineWidth = 7; ctx.stroke();
  ctx.strokeStyle = '#ff8c2a'; ctx.lineWidth = 3.5; ctx.stroke(); ctx.strokeStyle = '#5a2d0c'; ctx.lineWidth = 3;
  // body
  ctx.fillStyle = '#ff9a3c'; rr(-21, -42, 42, 42, 16); ctx.stroke();
  // ears
  for (const sd of [-1, 1]) {
    ctx.fillStyle = '#ff9a3c'; ctx.beginPath(); ctx.moveTo(sd * 20, -34); ctx.lineTo(sd * 16, -54); ctx.lineTo(sd * 5, -42); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffb3c1'; ctx.beginPath(); ctx.moveTo(sd * 16, -38); ctx.lineTo(sd * 15, -48); ctx.lineTo(sd * 9, -41); ctx.closePath(); ctx.fill();
  }
  // belly + paws
  ctx.fillStyle = '#fff3e0'; ctx.beginPath(); ctx.ellipse(0, -9, 12, 9, 0, 0, 7); ctx.fill();
  // stripes
  ctx.strokeStyle = '#d96a10'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-6, -41); ctx.lineTo(-6, -35); ctx.moveTo(0, -42); ctx.lineTo(0, -35); ctx.moveTo(6, -41); ctx.lineTo(6, -35); ctx.stroke();
  // eyes
  const ex = f * 2;
  for (const sd of [-1, 1]) {
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#5a2d0c'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(sd * 9 + ex, -26, 6, 7, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(sd * 9 + ex + f * 2, -25, 3.6, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sd * 9 + ex + f * 3, -27, 1.3, 0, 7); ctx.fill();
  }
  // nose, mouth, whiskers
  ctx.fillStyle = '#ff6f91'; ctx.beginPath(); ctx.moveTo(-3 + ex, -19); ctx.lineTo(3 + ex, -19); ctx.lineTo(ex, -15); ctx.fill();
  ctx.strokeStyle = '#5a2d0c'; ctx.lineWidth = 1.8; ctx.beginPath();
  ctx.moveTo(ex, -15); ctx.lineTo(ex, -13); ctx.moveTo(ex, -13); ctx.quadraticCurveTo(ex - 4, -9, ex - 7, -12); ctx.moveTo(ex, -13); ctx.quadraticCurveTo(ex + 4, -9, ex + 7, -12);
  for (const sd of [-1, 1]) { ctx.moveTo(sd * 15 + ex, -18); ctx.lineTo(sd * 26 + ex, -20); ctx.moveTo(sd * 15 + ex, -15); ctx.lineTo(sd * 26 + ex, -14); }
  ctx.stroke();
  // feet
  ctx.fillStyle = '#fff3e0'; ctx.strokeStyle = '#5a2d0c'; ctx.lineWidth = 2;
  for (const sd of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sd * 11, -1, 8, 4.5, 0, 0, 7); ctx.fill(); ctx.stroke(); }
    ctx.restore();
  }
  ctx.restore();
  // HUD
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 5; ctx.lineJoin = 'round';
  ctx.font = 'bold 40px system-ui'; txt(score + ' m', W / 2, 55);
  ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'left'; txt('Kỷ lục: ' + best + ' m', 14, 24);
  ctx.textAlign = 'center';
  if (!dead && jumps < 4) {
    ctx.font = 'bold 17px system-ui';
    txt('Chạm để nhảy – giữ lâu nhảy cao hơn', W / 2, H - 70);
    txt('Đừng để rơi xuống!', W / 2, H - 46);
  }
  if (dead) {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.5)';
    ctx.font = 'bold 44px system-ui'; txt('Ối! Rơi rồi 😵', W / 2, 280);
    ctx.font = 'bold 30px system-ui'; txt(score + ' m' + (score >= best && score > 0 ? '  🏆 Kỷ lục mới!' : ''), W / 2, 335);
    ctx.font = 'bold 18px system-ui'; txt('Kỷ lục: ' + best + ' m', W / 2, 370);
    if (deadT > 0.45) { ctx.font = 'bold 22px system-ui'; txt('Chạm để chơi lại', W / 2, 430); }
  }
}

reset();
let lt = performance.now();
function loop(n) {
  const dt = Math.min((n - lt) / 1000, 1 / 20); lt = n;
  update(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
