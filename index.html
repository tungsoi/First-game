<style>

  body{background:transparent}
  .gbtn{position:fixed;display:none;z-index:5;margin:0;padding:0;font:bold 26px "Courier New",monospace;color:#1b3a4b;background:#ffd84a;border:4px solid #1b3a4b;box-shadow:4px 6px 0 #1b3a4b,inset 0 4px 0 #fff3a8,inset 0 -6px 0 #e0a82a;border-radius:0;-webkit-appearance:none;appearance:none;touch-action:manipulation;cursor:pointer;line-height:1}

  .gbtn.mute.muted::after{content:"";position:absolute;left:3px;right:3px;top:50%;height:3px;background:#ff6b5e;transform:rotate(-35deg)}
  #ver{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));z-index:5;display:none;color:#fff;font:bold 14px "Courier New",monospace;text-shadow:2px 2px 0 #1b3a4b,-1px -1px 0 #1b3a4b;padding:10px 28px;touch-action:manipulation}
  #rot{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#122836;color:#fff;text-align:center;font:bold 18px/1.4 "Courier New",monospace}
  #rot span{font-size:44px}

  #gate{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:#fff;background:#122836;font:bold 17px/1.45 "Courier New",monospace;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));touch-action:manipulation}
  #gate.show{display:flex}
  #gate img{width:96px;height:96px;image-rendering:pixelated;border:4px solid #1b3a4b;border-radius:18px}
  #gate h1{margin:0;font-size:26px;line-height:1.2;text-shadow:2px 2px 0 #1b3a4b}
  #gate p{margin:0;max-width:320px}
  #gate ol{margin:0;padding:0;list-style:none;max-width:320px;text-align:left;counter-reset:s}
  #gate li{counter-increment:s;margin:8px 0;padding-left:34px;position:relative}
  #gate li::before{content:counter(s);position:absolute;left:0;top:-1px;width:24px;height:24px;border-radius:50%;background:#ffd84a;color:#1b3a4b;text-align:center;line-height:24px}
  #gate button{font:inherit;font-size:20px;color:#1b3a4b;background:#ffd84a;border:4px solid #1b3a4b;box-shadow:4px 6px 0 #1b3a4b;padding:12px 26px;border-radius:0;margin-top:6px}
  #gate button:active{transform:translate(2px,3px);box-shadow:2px 3px 0 #1b3a4b}
  #gate small{opacity:.75;font-size:13px;max-width:300px}
</style>

<body>

<canvas id="c"></canvas>
<script>
// ---- low-res pixel buffer (1 game px = 2 screen px) ----

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const bf = document.createElement('canvas');
const b = bf.getContext('2d', { willReadFrequently: true });
let SC = 2, SAFE = 0, bgN = 0, lastStrip = '';
const stripCv = document.createElement('canvas'), sctx = stripCv.getContext('2d', { willReadFrequently: true });
let debugOn = location.search.indexOf('debug') >= 0, dbgTaps = 0, dbgT = 0;
try { if (localStorage.getItem('frog_debug') === '1') debugOn = true; } catch (e) {}
// probes for the safe areas and every flavour of "viewport height" (browsers disagree, esp. iOS standalone)
const mkProbe = css => { const d = document.createElement('div'); d.style.cssText = 'position:fixed;top:0;left:0;width:1px;visibility:hidden;pointer-events:none;' + css; document.body.appendChild(d); return d; };
const probe = mkProbe('padding-top:env(safe-area-inset-top)'), probeB = mkProbe('padding-bottom:env(safe-area-inset-bottom)');

let SAFEB = 0, DBG = [];

addEventListener('resize', fit); addEventListener('orientationchange', () => { setTimeout(fit, 250); setTimeout(fit, 800); });
addEventListener('pageshow', fit); document.addEventListener('visibilitychange', () => { if (!document.hidden) fit(); });
if (window.visualViewport) visualViewport.addEventListener('resize', fit);

const SPEED = 107, MAXSPD = 200, ACC = 0.025, WATER = 14, G = 900, JV = 320, CUT = 0.42, PX = 55;
const VERSION = 'v1.9';
let updatedUntil = 0;
try { const pv = localStorage.getItem('frog_ver'); localStorage.setItem('frog_ver', VERSION); if (pv && pv !== VERSION) updatedUntil = performance.now() + 5000; } catch (e) {}
let best = 0; try { best = +localStorage.getItem('frog_best') || 0; } catch (e) {}
const R = (a, c) => a + Math.random() * (c - a);

const lerp = (a, c, k) => a + (c - a) * Math.min(1, k);
const rnd = Math.round;

// ---- pixel helpers ----
function rect(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(rnd(x), rnd(y), w, h); }
function pixEllipse(c, cx, cy, rx, ry, col) {

}
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, c, k) => `rgb(${rnd(lerp(a[0], c[0], k))},${rnd(lerp(a[1], c[1], k))},${rnd(lerp(a[2], c[2], k))})`;
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >> 13)) * 1274126177 | 0; return ((h ^ (h >> 16)) >>> 0) / 4294967296; };

// ---- game state ----
let gated = false, state = 'play', plats, fish, p, camX, camY, refY, lastEnd, lastY, speed, t, clock = 0, score, dead, deadT, jumps, parts, shake;

function reset() {
  plats = [{ ground: true, x: -300, w: 400, y: 0, L: 0 }];
  p = { x: 0, y: 0, vy: 0, on: true, buf: 0, coy: 0, sqx: 0, sqv: 0, stretch: 0, pl: 0, rot: 0 };
  camX = -PX; camY = CAMY0; refY = 0; lastEnd = 100; lastY = 0;
  state = 'play'; speed = SPEED; t = 0; score = 0; setTheme(0); toastT = 0; score = 0; dead = false; deadT = 0; jumps = 0; parts = []; shake = 0;
  fish = [];
  const cols = ['#ff9a3c', '#ffd84a', '#ff6f61', '#f2f2f2'];
  for (let i = 0; i < 9; i++) fish.push({ x: camX + R(0, W + 150), y: 0, dy: R(16, 70), d: Math.random() < .5 ? -1 : 1, v: R(10, 28), s: R(.8, 1.3), c: cols[i % 4], ph: R(0, 6) });
  gen();
}
function gen() {
  while (lastEnd < camX + W + 250) {
    const lvl = Math.min(t / 60, 1);
    const rise = plats.length < 4 ? R(-4, 14) : R(-48, 40);
    let gap = 8 + speed * R(0.06, 0.55);
    if (rise > 0) gap *= Math.max(0.55, 1 - rise / 70);
    const y = Math.min(lastY - rise, -6);
    const w = R(30, 70);
    const x = lastEnd + gap;
    plats.push({ x, w, y, L: y, ph: R(0, 6), dip: 0, fl: Math.random() < .3 ? (Math.random() < .5 ? -1 : 1) : 0 });

}
function waterAt(x) { return x < 100 ? 9999 : WATER; }
function puff(x, y, n, c) { for (let i = 0; i < n; i++) parts.push({ x, y, vx: R(-55, 55), vy: -R(30, 130), t: .6, c }); }

// ---- sound (WebAudio, synthesized) ----
let AC = null, muted = false, croakT = 6, beatN = 0;
try { muted = localStorage.getItem('frog_mute') === '1'; } catch (e) {}
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f0, f1, dur, type, vol, delay) {
  if (muted) return; const a = audio(); if (!a) return;
  const t0 = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
  g.gain.setValueAtTime(vol || .1, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);

}

  if (muted) return; const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain(), t0 = a.currentTime;

const sfxJump = () => { tone(300, 720, .13, 'square', .07); tone(150, 300, .1, 'triangle', .1); };
const sfxLand = () => { tone(190, 70, .1, 'triangle', .16); noise(.06, .08, 1800, 500); };
const sfxClick = () => { tone(520, 880, .09, 'square', .07); };
const sfxSplash = () => { noise(.55, .22, 2500, 200); tone(420, 70, .45, 'sawtooth', .05); };
const sfxChime = () => { [523, 659, 784, 1047].forEach((fq, i) => tone(fq, fq * 1.002, .25, 'triangle', .08, i * .09)); };
const sfxFanfare = () => { [523, 659, 784, 1047, 784, 1047].forEach((fq, i) => tone(fq, fq * 1.002, .2, 'square', .06, i * .11)); };
const sfxCroak = () => { tone(130, 95, .09, 'sawtooth', .05); tone(150, 100, .11, 'sawtooth', .05, .12); };
const MEL = [0, 2, 4, 7, 9, 7, 4, 2, 0, 4, 7, 12, 9, 7, 4, 2];
setInterval(() => {
  if (muted || !AC || state !== 'play' || dead) return;
  const sh = [0, -2, -5, 2, -7][themeIdx % 5], n = MEL[beatN % 16] + sh;
  tone(261.63 * Math.pow(2, n / 12), 261.63 * Math.pow(2, n / 12), .22, 'triangle', .035);
  if (beatN % 4 === 0) tone(130.8 * Math.pow(2, sh / 12), 130.8 * Math.pow(2, sh / 12), .5, 'sine', .05);
  beatN++;
}, 260);
function hudPt(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W * 2, y: (e.clientY - r.top) / r.height * H * 2 }; }
const MUTE = { x: 12, y: 34, w: 32, h: 28 };
function hitMute(e) {
  if (e.clientX === undefined) return false;
  const q = hudPt(e); return q.x >= MUTE.x - 6 && q.x <= MUTE.x + MUTE.w + 6 && q.y >= MUTE.y + SAFE - 6 && q.y <= MUTE.y + SAFE + MUTE.h + 6;
}

// ---- input ----
function btnRect() {
  return state === 'menu' ? { x: W - 120, y: Math.round(H * 1.1) + 40, w: 240, h: 60 } : { x: W - 120, y: 440 + (H - 350) - 30, w: 240, h: 60 };
}
function hitBtn(e) {
  if (e.clientX === undefined) return true; // keyboard
  const r = cv.getBoundingClientRect(), hx = (e.clientX - r.left) / r.width * W * 2, hy = (e.clientY - r.top) / r.height * H * 2, B = btnRect();
  return hx >= B.x - 12 && hx <= B.x + B.w + 12 && hy >= B.y - 12 && hy <= B.y + B.h + 12;
}
function press(e) {
  if (e && e.preventDefault) e.preventDefault();
  if (gated) return;

  if (state === 'menu') { if (kb) startGame(); return; }
  if (dead) { if (kb && deadT > 0.5) replayGame(); return; }

}
function startGame() { if (state === 'menu' && !gated) { state = 'play'; p.buf = 0; sfxClick(); } }
function replayGame() { if (dead && deadT > 0.5 && !gated) { reset(); sfxClick(); } }
function toggleMute() { audio(); muted = !muted; try { localStorage.setItem('frog_mute', muted ? '1' : '0'); } catch (err) {} if (!muted) sfxClick(); }
const bStart = document.getElementById('bStart'), bReplay = document.getElementById('bReplay'), bMute = document.getElementById('bMute'), verEl = document.getElementById('ver');
bStart.addEventListener('click', e => { e.preventDefault(); audio(); startGame(); });
bReplay.addEventListener('click', e => { e.preventDefault(); audio(); replayGame(); });
bMute.addEventListener('click', e => { e.preventDefault(); toggleMute(); });
verEl.addEventListener('click', () => {                 // 5 taps on the version label toggles the debug readout
  if (performance.now() - dbgT > 1200) dbgTaps = 0; dbgT = performance.now();
  if (++dbgTaps >= 5) { debugOn = !debugOn; dbgTaps = 0; try { localStorage.setItem('frog_debug', debugOn ? '1' : '0'); } catch (err) {} }
});
// place the DOM buttons over the canvas (positions follow the canvas's real on-screen rect)
const lastPos = new Map();
function placeBtn(el, show, x, y, w, h, font, r, sc) {
  const disp = show ? 'block' : 'none';
  if (el.style.display !== disp) el.style.display = disp;
  if (!show) return;
  const key = [r.left, r.top, sc, x, y].join('|');
  if (lastPos.get(el) === key) return; lastPos.set(el, key);
  el.style.left = Math.round(r.left + x * sc) + 'px'; el.style.top = Math.round(r.top + y * sc) + 'px';
  el.style.width = Math.round(w * sc) + 'px'; el.style.height = Math.round(h * sc) + 'px'; el.style.fontSize = Math.max(10, Math.round(font * sc)) + 'px';

function layoutUI() {
  const r = cv.getBoundingClientRect(), sc = r.width / (W * 2), menuB = { y: Math.round(H * 1.1) + 40 }, deadB = { y: 440 + (H - 350) - 30 };
  placeBtn(bStart, state === 'menu' && !gated, W - 120, menuB.y, 240, 60, 26, r, sc);
  placeBtn(bReplay, dead && deadT > 0.5 && !gated, W - 120, deadB.y, 240, 60, 26, r, sc);
  placeBtn(bMute, !gated, MUTE.x, MUTE.y + SAFE, MUTE.w, MUTE.h, 20, r, sc);
  bMute.classList.toggle('muted', muted);
  const showVer = state === 'menu' && !gated; if (showVer && verEl.textContent !== 'Phiên bản ' + VERSION) verEl.textContent = 'Phiên bản ' + VERSION;

  if (e && e.preventDefault) e.preventDefault();

addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('keydown', e => { if (!e.repeat && ['Space', 'ArrowUp', 'KeyW'].includes(e.code)) press(e); });

// ---- update ----
function stepParts(dt) {
