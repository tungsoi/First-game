<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ếch Nhảy Sen</title>
<style>
  html,body{margin:0;height:100%;background:#bfe6ff;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif}
  canvas{display:block;margin:0 auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W = 400, H = 700;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function fit() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const h = innerHeight, w = Math.min(innerWidth, h * W / H);
  cv.style.width = w + 'px'; cv.style.height = (w * H / W) + 'px';
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', fit); fit();

const G = 1800, JV = 760, CUT = 0.42, PX = 110, WY = 4, CAMY = -H * 0.55;
let best = 0; try { best = +localStorage.getItem('onlyup_best') || 0; } catch (e) {}
const R = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, k) => a + (b - a) * Math.min(1, k);

let plats, fish, p, camX, topX, speed, t, clock = 0, score, dead, deadT, jumps, parts, shake;

function reset() {
  plats = [{ x: -300, y: 0, w: 500, ground: true }];
  p = { x: 0, y: 0, vy: 0, on: true, buf: 0, coy: 0, face: 1, sqx: 0, sqv: 0, stretch: 0, pl: 0, rot: 0 };
  camX = -PX; topX = 200;
  speed = 180; t = 0; score = 0; dead = false; deadT = 0; jumps = 0; parts = []; shake = 0;
  fish = [];
  const cols = ['#ff9a3c', '#ffd84a', '#ff6f61', '#f4f4f4'];
  for (let i = 0; i < 10; i++) fish.push({ x: camX + R(0, W + 300), y: R(60, 260), d: Math.random() < .5 ? -1 : 1, v: R(20, 55), s: R(.7, 1.4), c: cols[i % 4], ph: R(0, 6) });
  gen();
}
function gen() {
  while (topX < camX + W + 500) {
    const lvl = Math.min(t / 90, 1);
    const gap = 25 + speed * R(0.12, 0.46);
    const w = 150 - 70 * lvl - R(0, 25);
    topX += gap;
    plats.push({ x: topX, y: 0, w, ph: R(0, 6), dip: 0, fl: Math.random() < .35 ? (Math.random() < .5 ? -1 : 1) : 0 });
    topX += w;
  }
}
function puff(x, y, n, c) { for (let i = 0; i < n; i++) parts.push({ x, y, vx: R(-110, 110), vy: -R(60, 260), t: .6, c }); }

function press(e) {
  if (e && e.preventDefault) e.preventDefault();
  if (dead) { if (deadT > 0.5) reset(); return; }
  p.buf = 0.12;
}
function release(e) {
  if (e && e.preventDefault) e.preventDefault();
  if (!p.on && p.vy < 0 && p.jumping) p.vy *= CUT;
  p.jumping = false;
}
function doJump() {
  p.vy = -JV; p.on = false; p.jumping = true; p.buf = 0; p.coy = 0; jumps++;
  p.sqx = -0.28; p.sqv = 0;
  puff(p.x, WY, 5, '#d6f5ff');
}
cv.addEventListener('pointerdown', press);
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('keydown', e => { if (!e.repeat && ['Space', 'ArrowUp', 'KeyW'].includes(e.code)) press(e); });
addEventListener('keyup', e => { if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) release(e); });

function stepParts(dt) {
  for (const q of parts) { q.t -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 700 * dt; }
  parts = parts.filter(q => q.t > 0);
}
function stepFish(dt) {
  for (const f of fish) {
    f.x += f.d * f.v * dt;
    if (f.x < camX - 150) { f.x = camX + W + R(40, 300); f.y = R(60, 260); }
    else if (f.x > camX + W + 450) { f.x = camX - R(40, 150); f.y = R(60, 260); }
  }
}
function stepFrogAnim(dt) {
  p.sqv += (-p.sqx * 420 - p.sqv * 20) * dt; p.sqx += p.sqv * dt;
  const ts = p.on ? 0 : -Math.min(Math.abs(p.vy) / 1400, 1) * 0.3;
  p.stretch = lerp(p.stretch, ts, dt * 14);
  p.pl = lerp(p.pl, p.on ? 0 : 1, dt * 14);
  p.rot = lerp(p.rot, p.on ? 0 : Math.max(-.35, Math.min(.35, p.vy / 1800)), dt * 10);
}

function update(dt) {
  clock += dt;
  stepFish(dt); stepParts(dt);
  if (dead) {
    deadT += dt; shake = Math.max(0, shake - dt * 20);
    p.y += 110 * dt; stepFrogAnim(dt);
    return;
  }
  t += dt;
  speed = Math.min(360, 180 + t * 4);
  for (const s of plats) {
    if (s.ground) continue;
    const onIt = p.on && p.x > s.x - 4 && p.x < s.x + s.w + 4;
    s.dip = lerp(s.dip, onIt ? 6 : 0, dt * 10);
    s.y = Math.sin(clock * 2.2 + s.ph) * 2.2 + s.dip;
  }
  const py = p.y;
  p.x += speed * dt;
  p.buf = Math.max(0, p.buf - dt);
  p.coy = Math.max(0, p.coy - dt);
  p.vy = Math.min(p.vy + G * dt, 1400);
  p.y += p.vy * dt;
  let landed = null;
  if (p.vy >= 0) {
    for (const s of plats) {
      if (py <= s.y + 3 && p.y >= s.y && p.x > s.x - 4 && p.x < s.x + s.w + 4) { landed = s; break; }
    }
  }
  if (landed) {
    if (!p.on) { p.sqx = 0.32; p.sqv = 0; puff(p.x, landed.y, 5, '#d6f5ff'); }
    p.y = landed.y; p.vy = 0; p.on = true; p.coy = 0.1; p.jumping = false;
    score = Math.max(score, Math.floor(p.x / 40));
  } else if (p.on) { p.on = false; p.coy = 0.1; }
  if (p.buf > 0 && (p.on || p.coy > 0)) doJump();
  stepFrogAnim(dt);
  if (score > best) { best = score; try { localStorage.setItem('onlyup_best', best); } catch (e) {} }
  camX = p.x - PX;
  if (p.y > 34) {
    dead = true; deadT = 0; shake = 6; puff(p.x, WY, 16, '#bfefff');
  }
  gen();
  plats = plats.filter(s => s.x + s.w > camX - 200);
  shake = Math.max(0, shake - dt * 20);
}

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function txt(s, x, y) { ctx.strokeText(s, x, y); ctx.fillText(s, x, y); }

function drawFish(f) {
  const s = f.s, d = f.d, wag = Math.sin(clock * 6 + f.ph) * 5 * s, fy = WY + f.y + Math.sin(clock + f.ph) * 4;
  ctx.save(); ctx.translate(f.x, fy); ctx.globalAlpha = 0.8;
  ctx.fillStyle = f.c;
  ctx.beginPath(); ctx.moveTo(-d * 14 * s, 0); ctx.lineTo(-d * 28 * s, -9 * s + wag); ctx.lineTo(-d * 28 * s, 9 * s + wag); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 0, 18 * s, 9 * s, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(-d * 2 * s, 3 * s, 11 * s, 3.5 * s, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(d * 10 * s, -2 * s, 1.8 * s, 0, 7); ctx.fill();
  ctx.restore();
}

function drawFrog() {
  const k = p.sqx + p.stretch;
  const br = p.on ? Math.sin(clock * 5) * 0.02 : 0;
  ctx.save(); ctx.translate(p.x, p.y + (p.on ? 0 : -2));
  ctx.rotate(p.rot);
  ctx.scale(1 + k * 0.7, 1 - k + br);
  const f = p.face, pl = p.pl;
  ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = '#1d6b2a';
  // hind leg
  ctx.fillStyle = '#4fbf50'; ctx.beginPath();
  ctx.ellipse(-f * (13 + 8 * pl), -6 - 6 * pl, 12 + 5 * pl, 7 - 0.5 * pl, f * 0.5 * pl, 0, 7);
  ctx.fill(); ctx.stroke();
  // body
  ctx.fillStyle = '#62d663'; ctx.beginPath(); ctx.ellipse(0, -20, 22, 18, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ecffd2'; ctx.beginPath(); ctx.ellipse(f * 4, -13, 13, 9, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#4fbf50'; for (const [x, y] of [[-10, -28], [-2, -24], [-14, -18]]) { ctx.beginPath(); ctx.arc(x, y, 2.6, 0, 7); ctx.fill(); }
  // eyes
  const eo = (clock % 3.2) < 0.12 ? 0.12 : 1;
  for (const x of [-7, 9]) {
    ctx.fillStyle = '#62d663'; ctx.beginPath(); ctx.arc(x, -35, 9, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(x, -36, 6, 6 * eo, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.ellipse(x + f * 2, -35, 3.4, 3.4 * eo, 0, 0, 7); ctx.fill();
    if (eo > .5) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + f * 3, -37, 1.2, 0, 7); ctx.fill(); }
  }
  // cheek + smile
  ctx.fillStyle = 'rgba(255,120,150,.6)'; ctx.beginPath(); ctx.arc(f * 15, -17, 4, 0, 7); ctx.fill();
  ctx.strokeStyle = '#1d6b2a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(f * 2, -19); ctx.quadraticCurveTo(f * 10, -11 + 4 * pl, f * 19, -22); ctx.stroke();
  // front foot
  ctx.fillStyle = '#4fbf50'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.ellipse(f * (12 + 3 * pl), -2 - 3 * pl, 8, 4, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawLeaf(s) {
  const cx = s.x + s.w / 2, cy = s.y + 3, rx = s.w / 2, ry = 9;
  // ripple on the water
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 2;
  const rp = (clock * 0.6 + s.ph) % 1;
  ctx.globalAlpha = 1 - rp; ctx.beginPath(); ctx.ellipse(cx, WY + 4, rx + 6 + rp * 12, ry + 2 + rp * 4, 0, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
  ctx.lineWidth = 3; ctx.strokeStyle = '#1c6b32'; ctx.fillStyle = '#3fbf5a';
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.ellipse(cx, cy, rx, ry, 0, 0.22, Math.PI * 2 - 0.22); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.beginPath(); ctx.ellipse(cx, cy - 2, rx * .8, ry * .55, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(28,107,50,.6)'; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let i = 1; i < 6; i++) { const a = 0.22 + i * (Math.PI * 2 - 0.44) / 6; ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * rx * .85, cy + Math.sin(a) * ry * .85); }
  ctx.stroke();
  if (s.fl) {
    const fx = cx + s.fl * s.w * 0.28, fy = s.y + 1;
    ctx.lineWidth = 2; ctx.strokeStyle = '#c2457a';
    for (const [ang, h] of [[-.7, 15], [.7, 15], [-.3, 19], [.3, 19], [0, 21]]) {
      ctx.save(); ctx.translate(fx, fy); ctx.rotate(ang); ctx.fillStyle = ang ? '#ff9fc4' : '#ffb8d4';
      ctx.beginPath(); ctx.ellipse(0, -h / 2, 4.5, h / 2, 0, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore();
    }
    ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(fx, fy - 3, 3, 0, 7); ctx.fill();
  }
}

function draw() {
  const k = Math.min(t / 150, 1) * 0.5;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `hsl(${200 + k * 80},${70 - k * 10}%,${80 - k * 40}%)`);
  g.addColorStop(1, `hsl(${190 + k * 20},60%,${92 - k * 25}%)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  for (let i = 0; i < 6; i++) {
    const cx = (((i * 157 - camX * 0.2) % (W + 160)) + W + 160) % (W + 160) - 80, cy = 40 + i * 37;
    ctx.beginPath(); ctx.ellipse(cx, cy, 50, 16, 0, 0, 7); ctx.ellipse(cx + 28, cy - 8, 30, 14, 0, 0, 7); ctx.fill();
  }
  ctx.save();
  if (shake > 0) ctx.translate(R(-.5, .5) * shake, R(-.5, .5) * shake);
  // far hills
  ctx.save(); ctx.translate(-camX * 0.35, -CAMY);
  for (let i = -1; i < 6; i++) {
    ctx.fillStyle = i % 2 ? '#8fd48a' : '#74c46f';
    ctx.beginPath(); ctx.ellipse(i * 260 + 100, WY, 170 + (i & 1) * 40, 70 + ((i * 37) & 31), 0, Math.PI, 0); ctx.fill();
  }
  ctx.restore();
  ctx.translate(-camX, -CAMY);
  // water
  const wg = ctx.createLinearGradient(0, WY, 0, WY + 330);
  wg.addColorStop(0, '#62cfe0'); wg.addColorStop(1, '#0b5272');
  ctx.fillStyle = wg; ctx.beginPath(); ctx.moveTo(camX - 10, CAMY + H + 20);
  for (let x = camX - 10; x <= camX + W + 10; x += 10) ctx.lineTo(x, WY + Math.sin(x * 0.05 + clock * 2) * 2);
  ctx.lineTo(camX + W + 10, CAMY + H + 20); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2; ctx.beginPath();
  for (let x = camX - 10; x <= camX + W + 10; x += 10) { const y = WY + Math.sin(x * 0.05 + clock * 2) * 2; x === camX - 10 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.stroke();
  for (const f of fish) drawFish(f);
  ctx.lineJoin = 'round';
  for (const s of plats) {
    if (s.x + s.w < camX - 20 || s.x > camX + W + 20) continue;
    if (s.ground) {
      ctx.fillStyle = '#8a5a2b'; ctx.fillRect(s.x, 0, s.w, 1200);
      ctx.fillStyle = '#4ccf4a'; ctx.fillRect(s.x, 0, s.w, 14);
      ctx.fillStyle = '#1f7a2a'; ctx.fillRect(s.x, 14, s.w, 3);
      ctx.fillStyle = '#6b4423'; ctx.fillRect(97, -40, 6, 40);
      ctx.fillStyle = '#ffe28a'; ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 3; rr(66, -66, 68, 30, 6); ctx.stroke();
      ctx.fillStyle = '#6b4423'; ctx.font = 'bold 18px system-ui'; ctx.textAlign = 'center'; ctx.fillText('0 m', 100, -45);
      continue;
    }
    drawLeaf(s);
  }
  for (const q of parts) { ctx.globalAlpha = Math.min(1, q.t * 2); ctx.fillStyle = q.c; ctx.fillRect(q.x, q.y, 4, 4); }
  ctx.globalAlpha = 1;
  if (dead) ctx.globalAlpha = Math.max(0.2, 1 - (p.y - 30) / 160);
  drawFrog();
  ctx.globalAlpha = 1;
  ctx.restore();
  // HUD
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 5; ctx.lineJoin = 'round';
  ctx.font = 'bold 40px system-ui'; txt(score + ' m', W / 2, 55);
  ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'left'; txt('Kỷ lục: ' + best + ' m', 14, 24);
  ctx.textAlign = 'center';
  if (!dead && jumps < 4) {
    ctx.font = 'bold 17px system-ui';
    txt('Chạm để nhảy – giữ lâu nhảy xa hơn', W / 2, H - 70);
    txt('Nhảy từ lá sen này sang lá sen khác!', W / 2, H - 46);
  }
  if (dead) {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.5)';
    ctx.font = 'bold 32px system-ui'; txt('Tõm! Rơi xuống ao 💦', W / 2, 280);
    ctx.font = 'bold 30px system-ui'; txt(score + ' m' + (score >= best && score > 0 ? '  🏆 Kỷ lục mới!' : ''), W / 2, 335);
    ctx.font = 'bold 18px system-ui'; txt('Kỷ lục: ' + best + ' m', W / 2, 370);
    if (deadT > 0.5) { ctx.font = 'bold 22px system-ui'; txt('Chạm để chơi lại', W / 2, 430); }
  }
}

reset();
let lt = performance.now();
function loop(n) {
  const dt = Math.min((n - lt) / 1000, 1 / 20); lt = n;
  update(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
